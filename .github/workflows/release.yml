name: Release preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing and provenance use the workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tools/build/release-gate.mjs
      - run: pnpm build:packages
      # Pack once, verify those tarballs in real consumers, then publish exactly them.
      - run: pnpm verify:packages
        env:
          CARVED_PACK_DIR: ${{ runner.temp }}/packages
      - name: Publish core, then react
        run: |
          npm publish "$RUNNER_TEMP"/packages/plurid-carved-ui-core-*.tgz --tag next --provenance --access public
          npm publish "$RUNNER_TEMP"/packages/plurid-carved-ui-react-*.tgz --tag next --provenance --access public
        env:
          # Only needed until trusted publishing is configured for both packages on npm.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
